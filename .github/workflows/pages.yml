name: Build worlds and deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm ci
      - run: npm test

      - name: Generate world reports
        run: |
          node src/cli.ts run scenarios/earthlike.ts --quiet
          node src/cli.ts run scenarios/ganglion-race.ts --quiet
          node src/cli.ts run scenarios/hypercognitive.ts --quiet
          node src/cli.ts run scenarios/medulla-less.ts --quiet
          node src/cli.ts run scenarios/climate-shock.ts --quiet
          node src/cli.ts run scenarios/close-orbiting-world.ts --quiet

      - run: npm run site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
